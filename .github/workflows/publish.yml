name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Python package and deploy it.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/LC-MCP-eduagent_tayra
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup packages and build
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pipx
          pipx run build

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
